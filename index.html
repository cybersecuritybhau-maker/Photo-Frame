<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reunion Photo Tool</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Reunion Photo Maker</h1>
        <p>Auto-fit your photo into the official frame</p>
        
        <div class="upload-section">
            <input type="file" id="imageUpload" accept="image/*" class="file-input">
            <label for="imageUpload" class="custom-file-upload">Choose Your Photo</label>
        </div>
        
        <div class="canvas-wrapper">
            <canvas id="outputCanvas"></canvas>
            <div id="placeholderText">Your photo will appear here</div>
        </div>

        <button id="downloadBtn" style="display:none;">Download 4K Photo</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
