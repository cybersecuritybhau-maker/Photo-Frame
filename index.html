<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Photo Frame Tool</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>
</head>
<body>
    <div class="container">
        <h1>Professional Photo Studio</h1>
        <p>Upload your photo to fit into our official frame</p>
        
        <div class="upload-section">
            <input type="file" id="imageUpload" accept="image/*" class="file-input">
            <label for="imageUpload" class="custom-file-upload">Choose Photo</label>
        </div>
        
        <div class="canvas-wrapper">
            <canvas id="outputCanvas"></canvas>
            <div id="loader" class="loader">Processing AI Face Match...</div>
        </div>

        <button id="downloadBtn" style="display:none;">Download 4K Photo</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
